# ProBlink: NUT driver config for ProLink USB UPSes.
#
# ProLink line-interactive UPSes (tested: PRO2000SFCU) use a Voltronic
# "USB to Serial" chip that shows up in `lsusb` as:
#     0665:5161 Cypress Semiconductor USB to Serial   (Manufacturer: INNO TECH)
# NUT drives it with nutdrv_qx, which auto-detects the Voltronic-QS protocol.

# Retry a few times if the USB device is slow to answer at start-up.
maxretry = 3

[ups1]
    driver = nutdrv_qx
    port = auto
    vendorid = 0665
    productid = 5161
    desc = "ProLink PRO2000SFCU"
